  .crest-id{ display:flex; align-items:center; gap:12px; }
  .header-actions{ display:flex; align-items:center; gap:8px; }
  .crest{

  }
  h1{
    font-family:"Oswald", ui-sans-serif, sans-serif; font-weight:600;

  }
  .subtitle{ color:var(--muted); font-size:14.5px; margin:0; }
  .meta-line{ color:var(--muted); font-size:12.5px; margin-top:10px; line-height:1.5; }
  .icon-btn{
    appearance:none; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    flex:none; transition:all .15s ease;
  }
  .icon-btn:hover{ color:var(--ink); border-color:var(--navy-2); }
  .icon-btn.active{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .next-card{
    margin-top:18px; background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:16px 18px; box-shadow:var(--shadow); display:none;
  }
  .next-card.show{display:block;}
  .next-label{
    font-family:"Oswald",sans-serif; text-transform:uppercase; letter-spacing:0.12em;
    font-size:11px; color:var(--red); font-weight:600; margin-bottom:6px;
  }
  .next-body{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .next-teams{ font-family:"Oswald",sans-serif; font-size:19px; font-weight:500; color:var(--ink); }
  .next-when{ color:var(--muted); font-size:13.5px; }
  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin:22px 0 8px; align-items:center; justify-content:space-between; }
  .filters{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--muted);
    padding:7px 14px; border-radius:999px; font-family:"Libre Franklin", sans-serif;
    font-size:13px; font-weight:600; cursor:pointer; transition:all 0.15s ease;
  }
  .chip:hover{border-color:var(--navy-2);}
  .chip.active{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .chip .count{ opacity:0.7; font-weight:500; margin-left:3px; }
  .ghost-btn{
    appearance:none; border:1px dashed var(--line); background:transparent; color:var(--muted);
    padding:7px 12px; border-radius:10px; font-family:"Libre Franklin", sans-serif;
    font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .ghost-btn:hover{ color:var(--ink); border-color:var(--navy-2); }
  .month-heading{
    font-family:"Oswald",sans-serif; font-size:13px; text-transform:uppercase; letter-spacing:0.14em;
    color:var(--muted); margin:28px 2px 10px; padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  .month-heading:first-of-type{margin-top:20px;}

    display:grid; grid-template-columns:56px 1fr auto; gap:14px; align-items:center;
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:13px 14px; margin-bottom:10px; box-shadow:var(--shadow);
  }
  .datebox{ text-align:center; line-height:1.05; }
  .datebox .dow{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); font-weight:600; }
  .datebox .day{ font-family:"Oswald",sans-serif; font-size:24px; font-weight:600; color:var(--ink); }
  .datebox .mon{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); }
  .info .teams{ font-size:15.5px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

    font-family:"Oswald",sans-serif; font-size:10.5px; font-weight:600; letter-spacing:0.06em;

  .tag.travel{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-line);}
  .info .sub{ margin-top:5px; font-size:13px; color:var(--muted); display:flex; flex-wrap:wrap; gap:2px 8px; }
  .info .sub .dot{opacity:0.5;}
  .info .addr{ margin-top:3px; font-size:12px; }
  .info .addr a{ color:var(--muted); text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:2px; }
  .info .addr a:hover{ color:var(--navy-2); text-decoration-color:var(--navy-2); }
  .side{ text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .time{ font-weight:700; font-size:14px; color:var(--ink); white-space:nowrap; }
  .mid{ font-size:11px; color:var(--muted); white-space:nowrap; }
  .score-badge{
    font-family:"Oswald",sans-serif; font-size:13px; font-weight:600; letter-spacing:0.02em;
    padding:2px 9px; border-radius:6px; white-space:nowrap;

  .score-badge.win{ background:var(--ok-bg); color:var(--ok-ink); border:1px solid var(--ok-line); }
  .score-badge.loss{ background:var(--err-bg); color:var(--err-ink); border:1px solid var(--err-line); }
  .score-badge.draw{ background:var(--surface-2); color:var(--muted); border:1px solid var(--line); }
  .empty{ text-align:center; color:var(--muted); padding:40px 0; font-size:14px; display:none; }
  .empty.show{display:block;}
  footer{
    margin-top:36px; padding-top:16px; border-top:1px solid var(--line);
    color:var(--muted); font-size:12.5px; line-height:1.6;

  .edit-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;

  .edit-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; }
  .edit-grid .full{ grid-column:1 / -1; }
  .gh-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; }
  .gh-grid .full{ grid-column:1 / -1; }

  .field input, .field select{

    border:1px solid var(--line); background:var(--bg); color:var(--ink);

  .field input:focus, .field select:focus{ outline:2px solid var(--navy-2); outline-offset:1px; }
  .edit-row-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .id-badge{ font-size:11px; color:var(--muted); }
  .remove-btn{
    appearance:none; border:1px solid var(--err-line); background:var(--err-bg); color:var(--err-ink);

  .remove-btn:hover{ filter:brightness(0.96); }
  .add-card{

    color:var(--muted); font-size:13.5px; font-weight:600; cursor:pointer; background:transparent;
    width:100%; font-family:inherit;

  .add-card:hover{ border-color:var(--navy-2); color:var(--ink); }
  .save-bar{

    background:var(--surface); border-top:1px solid var(--line);
    box-shadow:0 -8px 24px -12px rgba(24,30,50,0.18);
    padding:12px 18px; display:none; align-items:center; justify-content:center;
  }
  .save-bar.show{ display:flex; }
  .save-bar-inner{

  }
  .save-status{ font-size:12.5px; color:var(--muted); }
  .save-status.err{ color:var(--err-ink); }
  .save-status.ok{ color:var(--ok-ink); }

  .btn{

    .edit-grid{ grid-template-columns:1fr; }

    if(ap === "AM" && h === 12) h = 0;

    out += '<div class="field"><label>Repo owner (username or org)</label><input type="text" id="ghOwner" value="' + esc(g.owner) + '" placeholder="e.g. albertsmith"></div>';
    out += '<div class="field"><label>Repository name</label><input type="text" id="ghRepo" value="' + esc(g.repo) + '" placeholder="e.g. ac-river-schedule"></div>';
    out += '<div class="field"><label>Branch</label><input type="text" id="ghBranch" value="' + esc(g.branch || "main") + '" placeholder="main"></div>';
    out += '<div class="field"><label>File path</label><input type="text" id="ghPath" value="' + esc(g.path || "index.html") + '" placeholder="index.html"></div>';
    out += '<div class="field full"><label>Personal access token</label><input type="password" id="ghToken" value="' + esc(g.token) + '" placeholder="github_pat_..."></div>';
    out += '</div>';
    out += '<div class="edit-row-actions">';
    out += '<span class="id-badge">' + (state.github ? "Connected to " + esc(state.github.owner) + "/" + esc(state.github.repo) : "Not connected yet") + '</span>';
    out += '<span class="btn-row">';
    if(state.github){ out += '<button class="remove-btn" id="ghDisconnect">Disconnect</button>'; }
    out += '</span>';
    out += '</div>';
    out += '</div>';
    out += '<div class="save-bar show"><div class="save-bar-inner">';
    out += '<div class="save-status' + (state.saveMsgKind ? ' ' + state.saveMsgKind : '') + '">' + esc(state.saveMsg || "") + '</div>';
    out += '<div class="btn-row"><button class="btn secondary" id="ghCancel">Close</button><button class="btn primary" id="ghSave">Save Connection</button></div>';
    out += '</div></div>';
    return out;
  }

  function wireGithubToggle(){
    var ghBtn = document.getElementById("githubToggle");
    if(ghBtn){
      ghBtn.addEventListener("click", function(){
        state.showGithubPanel = true;
        state.ghDraft = state.github ? Object.assign({}, state.github) : null;
        state.saveMsg = "";
        state.saveMsgKind = "";
        render();
      });
    }

    var ghCancel = document.getElementById("ghCancel");
    if(ghCancel){
      ghCancel.addEventListener("click", function(){
        state.showGithubPanel = false;
        state.ghDraft = null;
        render();
      });
    }

    var ghSave = document.getElementById("ghSave");
    if(ghSave){
      ghSave.addEventListener("click", function(){
        var cfg = {
          owner: (document.getElementById("ghOwner").value || "").trim(),
          repo: (document.getElementById("ghRepo").value || "").trim(),
          branch: (document.getElementById("ghBranch").value || "").trim() || "main",
          path: (document.getElementById("ghPath").value || "").trim() || "index.html",
          token: (document.getElementById("ghToken").value || "").trim()
        };
        if(!cfg.owner || !cfg.repo || !cfg.token){
          state.saveMsg = "Owner, repository, and token are all required.";
          state.saveMsgKind = "err";
          render();
          return;
        }
        state.github = cfg;
        saveGithubConfig(cfg);
        state.showGithubPanel = false;
        state.ghDraft = null;
        state.saveMsg = "";
        state.saveMsgKind = "";
        render();
      });
    }

    var ghDisconnect = document.getElementById("ghDisconnect");
    if(ghDisconnect){
      ghDisconnect.addEventListener("click", function(){
        state.github = null;
        clearGithubConfig();
        state.showGithubPanel = false;
        state.ghDraft = null;
        render();
      });
    }
  }

  function wire(decorated){
    wireGithubToggle();
    var filtersEl = document.getElementById("filters");
    if(filtersEl){
      filtersEl.querySelectorAll(".chip").forEach(function(btn){
        btn.addEventListener("click", function(){
          state.filter = btn.getAttribute("data-filter");
          render();
        });
      });
    }

    var editToggle = document.getElementById("editToggle");
    if(editToggle){
      editToggle.addEventListener("click", function(){
        state.editMode = true;
        state.draft = state.matches.map(function(m){ return Object.assign({}, m); });
        state.saveMsg = "";
        state.saveMsgKind = "";
        render();
      });
    }

    var downloadBtn = document.getElementById("downloadCsv");
    if(downloadBtn){
      downloadBtn.addEventListener("click", function(){ downloadCsv(); });
    }

    var cancelBtn = document.getElementById("cancelEdit");
    if(cancelBtn){
      cancelBtn.addEventListener("click", function(){
        state.editMode = false;
        state.draft = null;
        render();
      });
    }

    var addBtn = document.getElementById("addMatch");
    if(addBtn){
      addBtn.addEventListener("click", function(){
        state.draft.push({
          id: "", opponent: "", homeAway: "home", date: "", time: "", tz: "CDT",
          location: "", address: "", city: "", outOfState: false,
          scoreFor: null, scoreAgainst: null
        });
        render();
      });
    }

    document.querySelectorAll(".remove-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        var idx = parseInt(btn.getAttribute("data-remove"),10);
        state.draft.splice(idx,1);
        render();
      });
    });

    document.querySelectorAll(".edit-grid input, .edit-grid select").forEach(function(el){
      el.addEventListener("change", function(){
        var idx = parseInt(el.getAttribute("data-idx"),10);
        var key = el.getAttribute("data-key");
        var val = el.value;
        if(key === "outOfState") val = (val === "yes");
        if(key === "id") val = val.trim() === "" ? "" : (isNaN(Number(val)) ? val : Number(val));
        if(key === "scoreFor" || key === "scoreAgainst") val = val.trim() === "" ? null : Number(val);
        state.draft[idx][key] = val;
      });
    });

    var saveBtn = document.getElementById("saveEdit");
    if(saveBtn){
      saveBtn.addEventListener("click", function(){ doSave(); });
    }
  }

  function downloadCsv(){
    if(!downloadsCap) return;
    var rows = [["Match ID","Home","Away","Date","Time","Timezone","Location","Address","City/State","Out of State","AC River Score","Opponent Score","Result"]];
    decorate(state.matches).sort(function(a,b){return a._utc-b._utc;}).forEach(function(m){
      rows.push([m.id, m.home, m.away, m.date, m.time, m.tz, m.location, m.address || "", m.city, m.outOfState ? "Yes" : "No", m.scoreFor==null?"":m.scoreFor, m.scoreAgainst==null?"":m.scoreAgainst, m._hasScore ? m._resultLabel : ""]);
    });
    var csv = rows.map(function(r){
      return r.map(function(v){
        var s = String(v == null ? "" : v);
        if(/[",\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
        return s;
      }).join(",");
    }).join("\r\n");
    downloadsCap.save({filename:"ac-river-u13-schedule.csv", data: csv}).catch(function(){ /* declined or unavailable */ });
  }

  function validate(draft){
    for(var i=0;i<draft.length;i++){
      var m = draft[i];
      if(!m.opponent || !m.opponent.trim()) return "Row " + (i+1) + ": opponent is required.";
      if(!m.date || !/^\d{4}-\d{2}-\d{2}$/.test(m.date)) return "Row " + (i+1) + ": date must be set (YYYY-MM-DD).";
      if(!m.time || !/\d{1,2}:\d{2}\s*(AM|PM)/i.test(m.time)) return "Row " + (i+1) + ": time must look like \"10:00 AM\".";
      if(!m.location || !m.location.trim()) return "Row " + (i+1) + ": location is required (use TBD if unknown).";
    }
    return null;
  }

  function doSave(){
    var err = validate(state.draft);
    if(err){
      state.saveMsg = err;
      state.saveMsgKind = "err";
      render();
      return;
    }
    if(!canEditHere()){
      state.saveMsg = "Saving isn\u2019t available in this view.";
      state.saveMsgKind = "err";
      render();
      return;
    }
    state.saving = true;
    state.saveMsg = "Saving\u2026";
    state.saveMsgKind = "";
    render();

    var cleaned = state.draft.map(function(m){
      return {
        id: m.id === "" ? "" : m.id,
        opponent: m.opponent.trim(),
        homeAway: m.homeAway,
        date: m.date,
        time: m.time.trim(),
        tz: m.tz,
        location: m.location.trim(),
        address: (m.address || "").trim(),
        city: (m.city || "").trim(),
        outOfState: !!m.outOfState,
        scoreFor: (m.scoreFor === "" || m.scoreFor === undefined) ? null : m.scoreFor,
        scoreAgainst: (m.scoreAgainst === "" || m.scoreAgainst === undefined) ? null : m.scoreAgainst
      };
    });

    if(artifactCap){
      var html = pageHTML(cleaned);
      artifactCap.publish(html).then(function(){
        // view reloads automatically on success
      }).catch(function(e){
        state.saving = false;
        if(e && (e.code === "not_writer" || e.code === "not_granted")){
          state.canWrite = false;
          state.editMode = false;
          state.draft = null;
          state.saveMsg = "";
        } else if(e && e.code === "conflict"){
          state.saveMsg = "Someone else just saved a change \u2014 reloading with the latest version.";
          state.saveMsgKind = "err";
        } else {
          state.saveMsg = (e && e.message) ? e.message : "Couldn\u2019t save \u2014 please try again.";
          state.saveMsgKind = "err";
        }
        render();
      });
    } else if(state.github && state.github.token){
      saveToGithub(cleaned).then(function(){
        state.saving = false;
        state.editMode = false;
        state.draft = null;
        state.matches = cleaned;
        state.saveMsg = "Saved to GitHub \u2014 your Pages site will update in about a minute.";
        state.saveMsgKind = "ok";
        render();
      }).catch(function(e){
        state.saving = false;
        if(e && e.code === "github_409"){
          state.saveMsg = "Someone else saved a change first \u2014 reload the page and try again.";
        } else if(e && e.code === "github_401"){
          state.saveMsg = "GitHub rejected the token \u2014 check it\u2019s valid and hasn\u2019t expired.";
        } else if(e && e.code === "github_404"){
          state.saveMsg = "Couldn\u2019t find that repo, branch, or file path \u2014 check the GitHub settings (gear icon).";
        } else if(e && e.code === "github_403"){
          state.saveMsg = "GitHub denied the request \u2014 make sure the token has Contents: Read and write access to this repo.";
        } else {
          state.saveMsg = (e && e.message) ? e.message : "Couldn\u2019t save to GitHub \u2014 please try again.";
        }
        state.saveMsgKind = "err";
        render();
      });
    }
  }

  function saveToGithub(cleanedMatches){
    var g = state.github;
    var encodedPath = g.path.split("/").map(encodeURIComponent).join("/");
    var apiBase = "https://api.github.com/repos/" + encodeURIComponent(g.owner) + "/" + encodeURIComponent(g.repo) + "/contents/" + encodedPath;
    var headers = {
      "Authorization": "Bearer " + g.token,
      "Accept": "application/vnd.github+json"
    };
    function toError(res){
      return res.json().catch(function(){ return {}; }).then(function(body){
        var e = new Error((body && body.message) || ("GitHub error " + res.status));
        e.code = "github_" + res.status;
        throw e;
      });
    }
    return fetch(apiBase + "?ref=" + encodeURIComponent(g.branch), { headers: headers })
      .then(function(res){ return res.ok ? res.json() : toError(res); })
      .then(function(fileInfo){
        var html = pageHTML(cleanedMatches);
        var putHeaders = Object.assign({"Content-Type": "application/json"}, headers);
        return fetch(apiBase, {
          method: "PUT",
          headers: putHeaders,
          body: JSON.stringify({
            message: "Update AC River U13 schedule",
            content: utf8ToB64(html),
            sha: fileInfo.sha,
            branch: g.branch
          })
        });
      })
      .then(function(res){ return res.ok ? res.json() : toError(res); });
  }

  function init(){
    state.github = loadGithubConfig();
    render();
    if(window.claude && typeof window.claude.use === "function"){
      window.claude.use("artifact").then(function(cap){
        artifactCap = cap;
        if(cap) render();
      });
      window.claude.use("downloads").then(function(cap){
        downloadsCap = cap;
        if(cap) render();
      });
    }
  }

  init();
};
appMain(MATCHES_DATA);
</script>
